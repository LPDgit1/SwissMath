[package]
name = "swissmath-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Thin browser WASM adapter for SwissMath Core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swissmath-core = { path = "../../crates/core" }
wasm-bindgen = "0.2.126"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
